<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background: rgba(13, 27, 42, 0.35);
      cursor: crosshair;
      overflow: hidden;
      font-family: 'Work Sans', sans-serif;
    }
    #hint {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      background: #13243a; color: #fff; padding: 8px 16px; border-radius: 999px;
      font-size: 13px; border: 1px solid #1e3a55;
    }
    #hint b { color: #ff6b35; }
    #selection {
      position: absolute; border: 2px solid #ff6b35;
      background: rgba(255, 107, 53, 0.12);
      display: none;
    }
    #dims {
      position: absolute; background: #ff6b35; color: #fff; font-size: 11px;
      padding: 2px 6px; border-radius: 4px; font-family: 'Geist Mono', monospace;
      display: none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to select a region &middot; <b>Enter</b> to confirm &middot; <b>Esc</b> to cancel</div>
  <div id="selection"></div>
  <div id="dims"></div>
  <script src="../shared/diagnostics.js"></script>
  <script src="region-picker.js"></script>
</body>
</html>
